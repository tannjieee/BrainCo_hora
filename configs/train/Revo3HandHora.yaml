# Training config for Hora Revo3 hand in Isaac Lab.
# num_actors is overridden at runtime from env.num_envs.

algo: PPO
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 8]

load_path: ''   # path to checkpoint; overridden by --checkpoint CLI arg

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 16384          # overridden at runtime from env.num_envs
  normalize_advantage: True
  reward_scale: 0.01
  gamma: 0.99
  tau: 0.95
  learning_rate: 3e-4
  kl_threshold: 0.01
  horizon_length: 16
  minibatch_size: 32768
  mini_epochs: 3
  clip_value: True
  critic_coef: 2
  entropy_coef: 0.001
  e_clip: 0.2
  bounds_loss_coef: 0.001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 250
  max_agent_steps: 300000000
  priv_info: True
  priv_info_dim: 18
  priv_info_embed_dim: 8
  proprio_adapt: False
  full_gravity_magnitude: 9.81
  full_gravity_tolerance: 0.02
  full_gravity_max_reset_rate: 0.003
  full_gravity_eval_epochs: 25
