rl_device: cuda:0
test: false
seed: 42
train:
  algo: PPO
  network:
    mlp:
      units:
      - 512
      - 256
      - 128
    priv_mlp:
      units:
      - 256
      - 128
      - 8
  load_path: ''
  ppo:
    output_name: run_sapota_planter
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: 8192
    normalize_advantage: true
    reward_scale: 0.01
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003
    kl_threshold: 0.01
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 3
    clip_value: true
    critic_coef: 2
    entropy_coef: 0.001
    e_clip: 0.2
    bounds_loss_coef: 0.001
    truncate_grads: true
    grad_norm: 1.0
    save_best_after: 0
    save_frequency: 250
    max_agent_steps: 300000000
    priv_info: true
    priv_info_dim: 18
    priv_info_embed_dim: 8
    proprio_adapt: false
    full_gravity_magnitude: 9.81
    full_gravity_tolerance: 0.02
    full_gravity_max_reset_rate: 0.003
    full_gravity_eval_epochs: 25
  stage2:
    learning_rate: 0.0003
    latent_loss_coef: 1.0
    action_loss_coef: 0.25
    grad_norm: 1.0
    teacher_warmup_steps: 10000000
    teacher_mix_steps: 40000000
    best_after_steps: 50000000
    best_min_episodes: 4096
    save_interval_steps: 25000000
    log_interval: 20
env_runtime:
  object:
    task: sapota_planter
    display_name: Sapota_Threshold_4_Ceramic_Round_Planter_Red
    kind: usd
    usd_path: /home/tan/hora2/BrainCo_hora/assets/usd/objects/sapota_planter/training.usda
    scale: 0.7
    source_size_m:
    - 0.105991
    - 0.109554
    - 0.097137
    scaled_size_m:
    - 0.0741937
    - 0.0766878
    - 0.0679959
    hand_pose: custom
    hand_joint_pos_rad:
      right_thumb_CMP_joint: 1.55
      right_thumb_CMR_joint: 0.93
      right_thumb_MCP_joint: 0.36
      right_thumb_PIP_joint: 0.15
      right_thumb_DIP_joint: 0.14
      right_index_MPR_joint: 0.22
      right_index_MCP_joint: 1.12
      right_index_PIP_joint: 0.27
      right_index_DIP_joint: 0.17
      right_middle_MPR_joint: 0.1
      right_middle_MCP_joint: 0.9
      right_middle_PIP_joint: 0.24
      right_middle_DIP_joint: 0.17
      right_ring_MPR_joint: -0.05
      right_ring_MCP_joint: 0.86
      right_ring_PIP_joint: 0.2
      right_ring_DIP_joint: 0.25
      right_little_MPR_joint: -0.18
      right_little_MCP_joint: 1.09
      right_little_PIP_joint: 0.14
      right_little_DIP_joint: 0.25
    object_init_pos_m:
    - 0.0
    - -0.08
    - 1.635
    object_init_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    rotation_axis_local:
    - 0.0
    - 0.0
    - 1.0
    target_axis_world:
    - 0.0
    - 0.0
    - 1.0
    axis_bidirectional: false
    enforce_axis_alignment: true
    axis_tilt_tolerance_deg: 10.0
    grasp_cache_path: cache/revo3_right_grasp_sapota_planter
  grasp_cache_path: cache/revo3_right_grasp_sapota_planter
  enable_tactile: true
  enable_contact_in_obs: true
  contact_order:
  - thumb_DIP
  - index_DIP
  - middle_DIP
  - ring_DIP
  - little_DIP
  policy_dt: 0.05
  gravity:
  - 0.0
  - 0.0
  - -0.05
