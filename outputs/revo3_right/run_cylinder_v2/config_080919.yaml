rl_device: cuda:0
test: false
seed: 42
train:
  algo: PPO
  network:
    mlp:
      units:
      - 512
      - 256
      - 128
    priv_mlp:
      units:
      - 256
      - 128
      - 8
  load_path: /home/tan/hora/BrainCo/outputs/revo3_right/run_cylinder_v2/stage1_nn/last.pth
  ppo:
    output_name: run_cylinder_v2
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: 4096
    normalize_advantage: true
    reward_scale: 0.01
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003
    kl_threshold: 0.01
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 3
    clip_value: true
    critic_coef: 2
    entropy_coef: 0.001
    e_clip: 0.2
    bounds_loss_coef: 0.001
    truncate_grads: true
    grad_norm: 1.0
    save_best_after: 0
    save_frequency: 250
    max_agent_steps: 450000000
    priv_info: true
    priv_info_dim: 18
    priv_info_embed_dim: 8
    proprio_adapt: false
    full_gravity_magnitude: 9.81
    full_gravity_tolerance: 0.02
    full_gravity_max_reset_rate: 0.003
    full_gravity_eval_epochs: 25
env_runtime:
  grasp_cache_path: cache/revo3_right_grasp_cylinder
